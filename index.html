<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Dice Board Rogue</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: #2A2320;
	background-color: #F2E8D0;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

/* Same warm ground and ink outline the game itself uses (see COL_PANEL /
   COL_INK in Main.gd), so the loading screen reads as part of the game
   rather than a generic engine splash the player waits through. */
#status {
	background: radial-gradient(ellipse at 50% 42%, #F7EDD6 0%, #EFE0BE 55%, #DFCCA2 100%);
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
	font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
}

#status-splash {
	display: none;
}

#status-loading {
	display: none;
	flex-direction: column;
	align-items: center;
	gap: 0.9rem;
	width: min(78vw, 22rem);
}

#status-loading.status-loading--visible {
	display: flex;
}

#status-die {
	width: 3.4rem;
	height: 3.4rem;
	background: #FFF7E6;
	border: 3px solid #2A2320;
	border-radius: 6px;
	box-shadow: 0 4px 0 rgba(42, 35, 32, 0.3);
	animation: status-die-spin 1.1s ease-in-out infinite;
}

@keyframes status-die-spin {
	0%, 100% { transform: rotate(-8deg) scale(1); }
	50% { transform: rotate(8deg) scale(1.05); }
}

#status-title {
	font-size: 1.05rem;
	font-weight: 700;
	letter-spacing: 0.04em;
}

#status-track {
	width: 100%;
	height: 0.85rem;
	background: #E6D6B4;
	border: 2px solid #2A2320;
	border-radius: 3px;
	overflow: hidden;
}

#status-fill {
	height: 100%;
	width: 0%;
	background: #F2B33D;
	transition: width 0.15s ease-out;
}

#status-percent {
	font-size: 0.8rem;
	color: #6B5C49;
	letter-spacing: 0.06em;
}

#status-progress, #status-notice {
	display: none;
}

#status-notice {
	background-color: #FFF7E6;
	border-radius: 0.4rem;
	border: 2px solid #C2453A;
	color: #2A2320;
	line-height: 1.4;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" src="index.png" alt="">
			<div id="status-loading">
				<div id="status-die"></div>
				<div id="status-title">Dice Board Rogue</div>
				<div id="status-track"><div id="status-fill"></div></div>
				<div id="status-percent">読み込み中…</div>
			</div>
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":1194800,"index.wasm":39513091},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

// Caches index.wasm/index.js/index.audio.worklet.js on first visit so a
// repeat load skips the ~10MB engine download. index.pck (the actual game
// content) is deliberately left uncached — see sw.js — so a new deploy is
// always picked up immediately.
if ('serviceWorker' in navigator) {
	navigator.serviceWorker.register('sw.js').catch((err) => {
		console.warn('Service worker registration failed:', err);
	});
}

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const statusLoading = document.getElementById('status-loading');
	const statusFill = document.getElementById('status-fill');
	const statusPercent = document.getElementById('status-percent');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusLoading.classList.toggle('status-loading--visible', mode === 'progress');
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					const pct = Math.min(100, Math.round((current / total) * 100));
					statusFill.style.width = pct + '%';
					statusPercent.textContent = pct + '%';
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusFill.style.width = '0%';
					statusPercent.textContent = '読み込み中…';
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
